<section id="layer-playhouse" class="channel-layer playhouse-layer" data-layer="playhouse">
  <canvas id="playhouse-canvas" aria-label="Marlin's Playhouse 3D game"></canvas>
  <div id="playhouse-fallback" class="playhouse-fallback">
    <span>CH 15 / BODY INPUT</span>
    <strong>BUILDING THE PLAYHOUSE</strong>
    <small id="playhouse-load-status">PROCEDURAL ROOM ACTIVE</small>
  </div>
  <div class="playhouse-chrome" aria-hidden="true">
    <header class="playhouse-bar">
      <span>CH 15 / MARLIN'S PLAYHOUSE</span>
      <strong id="playhouse-sensor">KINECT: CHECKING</strong>
      <time id="playhouse-time">04:00</time>
    </header>
    <div class="playhouse-score-block">
      <span>PROPERTY DAMAGE</span>
      <strong id="playhouse-score">000000</strong>
      <small id="playhouse-combo">COMBO ×01</small>
    </div>
    <div class="playhouse-binsky-meter">
      <span>BINSKY</span>
      <i><b id="playhouse-binsky-fill"></b></i>
    </div>
    <div id="playhouse-instruction" class="playhouse-instruction">
      STEP INTO FRAME / HOLD STILL TO ENTER
    </div>
    <div id="playhouse-results" class="playhouse-results">
      <span>FINAL PROPERTY REPORT</span>
      <strong id="playhouse-rank">ROOM TONE</strong>
      <b id="playhouse-final-score">000000</b>
      <small>START AGAIN FROM THE REMOTE</small>
    </div>
  </div>
</section>
