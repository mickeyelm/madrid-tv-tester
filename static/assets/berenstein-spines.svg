<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Two VHS spines held together, one printed BERENSTAIN and one printed BERENSTEIN">
  <rect width="600" height="600" fill="#000"/>
  <!-- shelf shadow -->
  <rect x="150" y="512" width="300" height="14" fill="#1a1a1a"/>
  <!-- left spine -->
  <g>
    <rect x="166" y="76" width="112" height="440" fill="#141414"/>
    <rect x="160" y="70" width="112" height="440" fill="#e4d9bf" stroke="#2b2b2b" stroke-width="3"/>
    <rect x="160" y="70" width="112" height="46" fill="#1d3f8a"/>
    <rect x="160" y="464" width="112" height="46" fill="#1d3f8a"/>
    <rect x="186" y="132" width="60" height="18" fill="#8b1d1d"/>
    <text transform="rotate(-90 216 300)" x="216" y="300" text-anchor="middle" dominant-baseline="central" font-family="Impact, 'Arial Black', Arial, sans-serif" font-weight="700" font-size="34" fill="#15213b" textLength="320" lengthAdjust="spacingAndGlyphs">THE BERENSTAIN BEARS</text>
  </g>
  <!-- right spine -->
  <g>
    <rect x="334" y="80" width="112" height="440" fill="#141414"/>
    <rect x="328" y="74" width="112" height="440" fill="#dccfb2" stroke="#2b2b2b" stroke-width="3"/>
    <rect x="328" y="74" width="112" height="46" fill="#1d3f8a"/>
    <rect x="328" y="468" width="112" height="46" fill="#1d3f8a"/>
    <rect x="354" y="136" width="60" height="18" fill="#8b1d1d"/>
    <text transform="rotate(-90 384 304)" x="384" y="304" text-anchor="middle" dominant-baseline="central" font-family="Impact, 'Arial Black', Arial, sans-serif" font-weight="700" font-size="34" fill="#15213b" textLength="320" lengthAdjust="spacingAndGlyphs">THE BERENSTEIN BEARS</text>
  </g>
</svg>
